services:
  - type: web
    name: authscope-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: AUTHSCOPE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GITHUB_SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/authscope.db
