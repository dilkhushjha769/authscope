[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Fast running isolated unit tests
    integration: Integration tests requiring mocked or live target services
    scope: Tests specifically asserting boundary enforcement and scope guard
    acceptance: System acceptance and full end-to-end workflow validation
    reliability: Failure modes, edge cases, and boundary stress tests
